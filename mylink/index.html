<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마이링크</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5ff;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      text-align: center;
    }

    .profile {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #5B5FC7;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 16px;
      font-size: 36px;
      font-weight: bold;
    }

    h1 {
      margin: 8px 0;
      font-size: 28px;
    }

    p {
      color: #666;
      margin-bottom: 24px;
    }

    .link {
      display: block;
      text-decoration: none;
      background: #5B5FC7;
      color: white;
      padding: 14px;
      margin: 12px 0;
      border-radius: 12px;
      font-weight: bold;
      transition: 0.2s;
    }

    .link:hover {
      background: #4549a8;
    }

    .footer {
      margin-top: 24px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="profile">MY</div>
    <h1>마이링크</h1>
    <p>나의 링크를 한 곳에 모아 공유하는 페이지입니다.</p>

    <a class="link" href="https://github.com" target="_blank">GitHub</a>
    <a class="link" href="https://www.instagram.com" target="_blank">Instagram</a>
    <a class="link" href="https://www.youtube.com" target="_blank">YouTube</a>

    <div class="footer">아이디어를 현실로 - 바이브 코딩</div>
  </main>
</body>
</html>
